<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F1E8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1713" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      The theme, before the first paint. A saved "light" or "dark" has to be on <html> by the time
      the stylesheet applies, or the page renders in the system theme for a frame and then flips —
      a white flash on the way into a dark app is the one thing people notice about dark mode.
      Inline and tiny on purpose: a module script is too late.
    -->
    <script>
      try {
        var t = localStorage.getItem("tally.theme");
        if (t === "dark" || t === "light") {
          document.documentElement.dataset.theme = t;
          var c = t === "dark" ? "#1A1713" : "#F6F1E8";
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (tag) { tag.content = c; });
        }
      } catch (e) {}
    </script>
    <!--
      One document serves the whole site. These tags describe Tally itself, which is what the bare
      domain is; the Worker rewrites them for a pool under /p/<slug>, so a pool link unfurls with
      the pool's own name and card. Nothing here names a host — the Worker makes URLs absolute
      against whatever host served the page.
    -->
    <meta name="description" content="Tally is where you and your friends play simple, free pools. Pick a game, share a link, and everyone's in — nothing to install." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tally" />
    <meta property="og:title" content="Tally — pools to play with your friends" />
    <meta property="og:description" content="Simple, free, fun games to play with your friends. Pick a game, share a link, and everyone's in." />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og-tally.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tally — pools to play with your friends" />
    <meta name="twitter:description" content="Simple, free, fun games to play with your friends." />
    <meta name="twitter:image" content="/og-tally.jpg" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Tally — pools to play with your friends</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
