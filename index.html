<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F1E8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      One document serves the whole site. These tags describe Tally itself, which is what the bare
      domain is; the Worker rewrites them for a pool under /p/<slug>, so a pool link unfurls with
      the pool's own name and card. Nothing here names a host — the Worker makes URLs absolute
      against whatever host served the page.
    -->
    <meta name="description" content="Tally is where you and your friends play simple, free pools. Pick a game, share a link, and everyone's in — no signup, no app to install." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tally" />
    <meta property="og:title" content="Tally — pools to play with your friends" />
    <meta property="og:description" content="Simple, free, fun games to play with your friends. Pick a game, share a link, and everyone's in." />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og-tally.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tally — pools to play with your friends" />
    <meta name="twitter:description" content="Simple, free, fun games to play with your friends." />
    <meta name="twitter:image" content="/og-tally.jpg" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Tally — pools to play with your friends</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
