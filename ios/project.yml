# XcodeGen fallback for Tally.xcodeproj. The checked-in project is the source of truth and opens
# in Xcode 26 as is; if it ever fails to open (a pbxproj is unforgiving of a hand edit), regenerate
# it from this file instead of repairing it by hand:
#
#     brew install xcodegen && cd ios && xcodegen generate
#
# Both describe the same thing: an app target from the Tally folder and a widget extension from
# TallyWidgets, both depending on the local TallyKit package, signed with your team, iOS 26 and up.
#
# Note where the extension's Info.plist and entitlements live: beside the folder, not inside it.
# The target's sources are a synchronised folder, so anything within it is also copied in as a
# resource, and a file that is both processed and copied is "Multiple commands produce" — a build
# failure rather than a warning.
name: Tally
options:
  bundleIdPrefix: app.playtally
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  TallyKit:
    path: TallyKit
targets:
  Tally:
    type: application
    platform: iOS
    sources:
      - path: Tally
    dependencies:
      - package: TallyKit
    entitlements:
      path: Tally/Tally.entitlements
    info:
      path: Build/Info.plist
      properties:
        CFBundleDisplayName: Tally
        LSApplicationCategoryType: public.app-category.sports
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        # A Live Activity's push updates are budgeted by the system. This asks for the higher
        # allowance, which a scoreboard genuinely needs: the Worker rewrites the lock screen every
        # time a slate settles, across a Sunday, and without it the later ones are the ones dropped.
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Light
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.playtally.ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8445LWRG3B
    dependencies:
      - target: TallyWidgetsExtension
        embed: true

  TallyWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TallyWidgets
    dependencies:
      - package: TallyKit
    entitlements:
      path: TallyWidgets.entitlements
    info:
      path: TallyWidgetsInfo.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.playtally.ios.widgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8445LWRG3B
        SKIP_INSTALL: YES
